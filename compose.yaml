services:
  deye-bot:
    build: .
    container_name: deye-bot
    env_file: .env
    environment:
      DB_PATH: /app/data/deye.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Backstop: normal use stays near 100 MB.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
